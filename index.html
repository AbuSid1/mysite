<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R0N4JL5E8N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());

    // Generate unique random Client ID (Format: <timestamp>.<randomInt>)
    const randomClientId = `${Math.floor(Date.now() / 1000)}.${Math.floor(Math.random() * 2147483647)}`;

    // Generate random Session ID
    const randomSessionId = `${Math.floor(Date.now() / 1000)}`;

    // Pool of organic search engines and query structures
    const organicEngines = [
      { source: "google", referrer: "https://www.google.com/" },
      { source: "bing", referrer: "https://www.bing.com/" },
      { source: "duckduckgo", referrer: "https://duckduckgo.com/" },
      { source: "yahoo", referrer: "https://search.yahoo.com/" }
    ];

    const selectedEngine = organicEngines[Math.floor(Math.random() * organicEngines.length)];

    // Initialize GA4 with simulated attribution variables
    gtag('config', 'G-R0N4JL5E8N', {
      'send_page_view': false,
      'client_id': randomClientId,
      'session_id': randomSessionId,
      'page_referrer': selectedEngine.referrer,
      'campaign_source': selectedEngine.source,
      'campaign_medium': 'organic',
      'ignore_referrer': false
    });
  </script>

  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .box {
      max-width: 480px;
      width: 100%;
    }
    #log {
      margin-top: 1.5rem;
      background: #1e293b;
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Welcome to the Site</h2>
    <p style="color: #94a3b8;">Processing visit attribution...</p>
    <div id="log">Starting tracking pipeline...</div>
  </div>

  <script>
    const _p = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTU1MzU1MTIzMDY1ODQxNjc5MS9BUmdSd2ZFOVZlMExCQXBsX0YtaS1Hc1hwNkt6aGJURUM1QkVfN3dCeGc0ZHFjbnozOXZVLWZ2WWlVaUdaY3JfVnZnTQ==";

    const logBox = document.getElementById("log");
    function print(msg) {
      logBox.textContent += "\n" + msg;
    }

    function generateRandomPublicIP() {
      const allowedFirstOctets = [8, 24, 45, 64, 82, 104, 142, 157, 185, 198, 203, 212];
      const octet1 = allowedFirstOctets[Math.floor(Math.random() * allowedFirstOctets.length)];
      const octet2 = Math.floor(Math.random() * 254) + 1;
      const octet3 = Math.floor(Math.random() * 254) + 1;
      const octet4 = Math.floor(Math.random() * 254) + 1;
      return `${octet1}.${octet2}.${octet3}.${octet4}`;
    }

    async function runPipeline() {
      try {
        const fakeIP = generateRandomPublicIP();
        print(`1. Generated Test IP: ${fakeIP}`);

        print(`2. Fetching geo-metadata...`);
        const res = await fetch(`https://ipwho.is/${fakeIP}`);
        const data = await res.json();

        const city = data.city || "Unknown City";
        const region = data.region || "Unknown Region";
        const country = data.country || "Unknown Country";
        const isp = data.connection?.isp || "Unknown ISP";

        print(`Attribution source: ${selectedEngine.source} (${selectedEngine.referrer})`);

        // 3. Dispatch GA4 Page View with simulated organic attribution
        print("3. Sending page_view to GA4...");
        gtag('event', 'page_view', {
          'page_location': window.location.href,
          'page_referrer': selectedEngine.referrer,
          'campaign_source': selectedEngine.source,
          'campaign_medium': 'organic',
          'session_engaged': 1,
          'engagement_time_msec': 12000, // 12 seconds to satisfy engagement threshold
          'simulated_ip': fakeIP,
          'simulated_city': city,
          'simulated_country': country
        });
        print("GA4 payload transmitted.");

        // 4. Send report to Discord
        print("4. Forwarding to Discord...");
        const textMessage = `🎲 **Visitor Log**\n• **Attribution:** Organic Search (${selectedEngine.source})\n• **Simulated IP:** ${fakeIP}\n• **Location:** ${city},${region}, ${country}\n• **ISP:** ${isp}\n• **GA4 Client ID:** \`${randomClientId}\``;

        const destination = atob(_p);
        const discordRes = await fetch(destination, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: textMessage })
        });

        if (discordRes.ok || discordRes.status === 204) {
          print("SUCCESS! Pipeline finished.");
        } else {
          print(`Discord notification failed with status: ${discordRes.status}`);
        }

      } catch (err) {
        print("Pipeline Error: " + err.message);
      }
    }

    runPipeline();
  </script>
</body>
</html>
