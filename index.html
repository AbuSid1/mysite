<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R0N4JL5E8N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());

    // Generate unique Client ID and Session ID on every refresh
    const randomClientId = `${Math.floor(Date.now() / 1000)}.${Math.floor(Math.random() * 2147483647)}`;
    const randomSessionId = `${Math.floor(Date.now() / 1000)}`;

    // Random Attribution: 75% Organic, 25% Direct/Referral
    const isOrganic = Math.random() < 0.75;
    let chosenSource = "direct";
    let chosenMedium = "none";
    let chosenReferrer = "";

    if (isOrganic) {
      const searchEngines = [
        { source: "google", ref: "https://www.google.com/" },
        { source: "bing", ref: "https://www.bing.com/" },
        { source: "duckduckgo", ref: "https://duckduckgo.com/" },
        { source: "yahoo", ref: "https://search.yahoo.com/" }
      ];
      const engine = searchEngines[Math.floor(Math.random() * searchEngines.length)];
      chosenSource = engine.source;
      chosenMedium = "organic";
      chosenReferrer = engine.ref;
    } else {
      chosenSource = "direct";
      chosenMedium = "none";
      chosenReferrer = "";
    }

    gtag('config', 'G-R0N4JL5E8N', {
      'send_page_view': false,
      'client_id': randomClientId,
      'session_id': randomSessionId,
      'page_referrer': chosenReferrer,
      'campaign_source': chosenSource,
      'campaign_medium': chosenMedium,
      'ignore_referrer': false
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      text-align: center;
    }

    .box {
      max-width: 520px;
      width: 100%;
    }

    .timer-container {
      margin: 1.5rem 0;
      padding: 1.25rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .timer-label {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .timer-display {
      font-size: 2.75rem;
      font-weight: 700;
      font-family: monospace;
      color: #38bdf8;
    }

    .interaction-panel {
      margin: 1.5rem 0;
      padding: 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
    }

    .selected-text {
      font-size: 1.15rem;
      color: #f8fafc;
      font-weight: 600;
    }

    .selected-text span {
      color: #38bdf8;
      font-family: monospace;
      font-size: 1.35rem;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 0.45rem;
      margin-top: 1rem;
      max-height: 240px;
      overflow-y: auto;
      padding: 0.5rem;
      background: #0b1120;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }

    .num-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.55rem 0;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .num-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .num-btn:active {
      transform: scale(0.95);
    }

    #log {
      margin-top: 1.5rem;
      background: #1e293b;
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Welcome to the Site</h2>
    <p style="color: #94a3b8;">Processing session and analytics...</p>

    <!-- 1s to 60s Looping Timer -->
    <div class="timer-container">
      <div class="timer-label">Session Elapsed Time</div>
      <div class="timer-display" id="timer">1s</div>
    </div>

    <!-- 1 to 50 Interactive Numbers Panel -->
    <div class="interaction-panel">
      <div class="selected-text" id="statusText">Click any number: <span>None</span></div>
      <div class="button-grid" id="buttonGrid"></div>
    </div>

    <div id="log">Initializing...</div>
  </div>

  <script>
    // 1. Generate 1 to 50 Interactive Buttons
    const grid = document.getElementById("buttonGrid");
    const statusText = document.getElementById("statusText");

    for (let i = 1; i <= 50; i++) {
      const btn = document.createElement("button");
      btn.className = "num-btn";
      btn.textContent = i;
      btn.onclick = () => {
        statusText.innerHTML = `You selected: <span>Button #${i}</span>`;
        gtag('event', 'select_content', {
          'content_type': 'button',
          'item_id': `${i}`
        });
      };
      grid.appendChild(btn);
    }

    // 2. Looping Timer (Starts at 1, goes to 60, resets to 1)
    let seconds = 1;
    const timerElement = document.getElementById("timer");

    setInterval(() => {
      seconds++;
      if (seconds > 60) {
        seconds = 1;
      }
      timerElement.textContent = `${seconds}s`;
    }, 1000);

    // 3. Webhook Token and Obfuscated Discord Transport
    const _p = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTU1MzU1MTIzMDY1ODQxNjc5MS9BUmdSd2ZFOVZlMExCQXBsX0YtaS1Hc1hwNkt6aGJURUM1QkVfN3dCeGc0ZHFjbnozOXZVLWZ2WWlVaUdaY3JfVnZnTQ==";

    const logBox = document.getElementById("log");
    function print(msg) {
      logBox.textContent += "\n" + msg;
    }

    // Random Real-World Public IP Generator
    function getRandomPublicIP() {
      const firstOctets = [8, 24, 45, 64, 82, 104, 142, 157, 185, 198, 203, 212, 13, 34, 52, 152, 178];
      const octet1 = firstOctets[Math.floor(Math.random() * firstOctets.length)];
      const octet2 = Math.floor(Math.random() * 254) + 1;
      const octet3 = Math.floor(Math.random() * 254) + 1;
      const octet4 = Math.floor(Math.random() * 254) + 1;
      return `${octet1}.${octet2}.${octet3}.${octet4}`;
    }

    async function runPipeline() {
      try {
        const randomIP = getRandomPublicIP();
        print(`1. Resolving location for IP: ${randomIP}...`);

        const res = await fetch(`https://ipwho.is/${randomIP}`);
        const data = await res.json();

        const ip = data.ip || randomIP;
        const city = data.city || "Unknown City";
        const region = data.region || "Unknown Region";
        const country = data.country || "Unknown Country";
        const isp = data.connection?.isp || data.org || "Unknown ISP";

        print(`Resolved: ${city}, ${country} (${isp})`);

        // GA4 Recording
        print("2. Dispatching session event to GA4...");
        gtag('event', 'page_view', {
          'page_location': window.location.href,
          'page_referrer': chosenReferrer,
          'campaign_source': chosenSource,
          'campaign_medium': chosenMedium,
          'session_engaged': 1,
          'engagement_time_msec': 14000,
          'ip': ip,
          'city': city,
          'region': region,
          'country': country,
          'isp': isp
        });

        // Discord Notification matching exact screenshot format
        print("3. Forwarding log to Discord...");
        const attributionLabel = isOrganic ? `Organic Search (${chosenSource})` : "Direct";

        const textMessage = `🎲 **Visitor Log**\n` +
          `• **Attribution:** ${attributionLabel}\n` +
          `• **IP:** ${ip}\n` +
          `• **Location:** ${city},${region},${country}\n` +
          `• **ISP:** ${isp}\n` +
          `• **GA4 Client ID:** \`${randomClientId}\``;

        const destination = atob(_p);
        const discordRes = await fetch(destination, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: textMessage })
        });

        if (discordRes.ok || discordRes.status === 204) {
          print("SUCCESS! Visit recorded.");
        } else {
          print(`Discord error status: ${discordRes.status}`);
        }

      } catch (err) {
        print("Execution Error: " + err.message);
      }
    }

    runPipeline();
  </script>
</body>
</html>
