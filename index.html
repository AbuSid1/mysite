
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
        }

        #number {
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 25px;
            overflow-wrap: anywhere;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .results {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .results h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .results p {
            margin-bottom: 20px;
        }

        .ad-container {
            width: 100%;
            max-width: 468px;
            min-height: 60px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .diagnostics {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .diagnostics h2 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        #ad-status {
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Random Number Generator</h1>

        <div id="number">0</div>

        <button id="generateButton" type="button">
            Generate Number
        </button>
    </div>

    <div class="results">
        <h2>Real Result</h2>
        <p>Direct display: <span id="direct">Not checked</span></p>

        <h2>Spoofed Result</h2>
        <p>Via fetch: <span id="spoofed">Not checked</span></p>
    </div>

    <!-- Ad display area -->
    <div class="ad-container" id="ad-container">
        <!-- The ad provider controls whether an ad is displayed. -->
    </div>

    <!-- Diagnostic information -->
    <div class="diagnostics">
        <h2>Ad Diagnostic Status</h2>
        <p id="ad-status">Preparing ad request...</p>
    </div>

    <!--
      The following IP-spoofing test code is intentionally disabled.
      Changing browser-side API responses does not change the real
      public IP address seen by a server.
    -->

    <!-- Random number generator -->
    <script>
        const numberElement = document.getElementById("number");
        const generateButton = document.getElementById("generateButton");

        generateButton.addEventListener("click", function () {
            const randomNumber = Math.floor(Math.random() * 1000000);
            numberElement.textContent = randomNumber;
        });
    </script>

    <!-- Ad configuration and diagnostics -->
    <script>
        window.atOptions = {
            key: "da8d1724648cc463d239e0d75a24c4a0",
            format: "iframe",
            height: 60,
            width: 468,
            params: {}
        };

        const statusElement = document.getElementById("ad-status");

        function updateStatus(message) {
            statusElement.textContent += "\n" + message;
            console.log("[Ad diagnostic]", message);
        }

        statusElement.textContent = "Page loaded. Starting ad request...";

        window.addEventListener("error", function (event) {
            updateStatus("Page error: " + (event.message || "Unknown error"));
        });

        window.addEventListener("unhandledrejection", function (event) {
            updateStatus(
                "Promise error: " +
                String(event.reason || "Unknown error")
            );
        });
    </script>

    <!-- Original ad provider script-loading method -->
    <script
        src="https://bauval.org/22/da8d1724648cc463d239e0d75a24c4a0"
        onload="document.getElementById('ad-status').textContent += '\nAd script loaded successfully.'; console.log('[Ad diagnostic] Script loaded');"
        onerror="document.getElementById('ad-status').textContent += '\nAd script failed to load.'; console.error('[Ad diagnostic] Script failed to load');">
    </script>

      Second ad is intentionally disabled during testing.
      Enable it only after testing the first ad independently.

        };
    </script>
    <script src="https://bauval.org/22/1ae837e6306b6a44fd06d1836a37a9fd"></script>
    -->

</body>
</html>
