<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .box {
      max-width: 450px;
      width: 100%;
    }
    #log {
      margin-top: 1.5rem;
      background: #1e293b;
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Welcome to the Site</h2>
    <p style="color: #94a3b8;">Testing simulated visitor logging...</p>
    <div id="log">Starting test...</div>
  </div>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1553533799948755070/1qNcnLdY-FtfIVl_qygR7qJWysfV7IwHTI8mnAi1f_k76OhmOvtX0ZXwYLE_phql4tDD";

    const logBox = document.getElementById("log");
    function print(msg) {
      logBox.textContent += "\n" + msg;
    }

    // Helper to generate a realistic public IPv4 address
    function generateRandomPublicIP() {
      // Pick first octet avoiding 0, 10, 127, 172, 192, 224+ (reserved/private ranges)
      const allowedFirstOctets = [8, 24, 45, 64, 82, 104, 142, 157, 185, 198, 203, 212];
      const octet1 = allowedFirstOctets[Math.floor(Math.random() * allowedFirstOctets.length)];
      const octet2 = Math.floor(Math.random() * 254) + 1;
      const octet3 = Math.floor(Math.random() * 254) + 1;
      const octet4 = Math.floor(Math.random() * 254) + 1;
      return `${octet1}.${octet2}.${octet3}.${octet4}`;
    }

    async function testSend() {
      try {
        const fakeIP = generateRandomPublicIP();
        print("1. Generated Random IP: " + fakeIP);

        // Fetch location and ISP metadata for the random IP
        print("2. Fetching metadata for " + fakeIP + "...");
        const res = await fetch(`https://ipwho.is/${fakeIP}`);
        const data = await res.json();
        
        const city = data.city || "Unknown City";
        const region = data.region || "Unknown Region";
        const country = data.country || "Unknown Country";
        const isp = data.connection?.isp || "Unknown ISP";

        print("Resolved location: " + city + ", " + country);
        print("3. Sending to Discord...");

        const textMessage = `🎲 **Random Visitor Log**\n• **Simulated IP:** ${fakeIP}\n• **Location:** ${city}, ${region}, ${country}\n• **ISP:** ${isp}\n• **User-Agent:** ${navigator.userAgent.slice(0, 80)}`;

        const discordRes = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ content: textMessage })
        });

        if (discordRes.ok || discordRes.status === 204) {
          print("SUCCESS! Sent to Discord (Status: " + discordRes.status + ")");
        } else {
          const errText = await discordRes.text();
          print("FAILED by Discord. Status: " + discordRes.status + "\nResponse: " + errText);
        }

      } catch (err) {
        print("ERROR: " + err.message);
      }
    }

    testSend();
  </script>
</body>
</html>
