<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Number Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;

            width: 350px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #number {
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;

            background: #007bff;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Random Number Generator</h1>

        <div id="number">0</div>

        <button id="generateBtn">
            Generate Random Number
        </button>

    </div>


    <script>
const originalFetch = window.fetch;

window.fetch = async function(...args) {
    const requestUrl = args[0];

    if (typeof requestUrl === 'string' && (requestUrl.includes('ipify.org') || requestUrl.includes('/get-ip'))) {
        
        console.log("Intercepted IP request! Returning NEW synthetic IP.");
        
        // Naya Synthetic Data (London, UK)
        const syntheticData = {
            ip: "198.51.100.42", 
            city: "London",
            region: "England",
            country: "GB",
            loc: "51.5074,-0.1278" 
        };

        return new Response(JSON.stringify(syntheticData), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
        });
    }

    return originalFetch.apply(this, args);
};



         
        const numberDisplay = document.getElementById("number");
        const generateBtn = document.getElementById("generateBtn");

        generateBtn.addEventListener("click", function () {

            // Generate random number between 1 and 100
            const randomNumber = Math.floor(Math.random() * 100) + 1;

            numberDisplay.textContent = randomNumber;

        });
    </script>
